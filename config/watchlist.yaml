# Holdco Intel watchlist. This is the ONLY place companies are defined.
# A second dashboard (e.g. the AI value chain) is a second file with the same shape.
#
# Fields marked "verify" are best-effort starting values. docs/PLAN.md step 02 checks
# tickers and FX symbols; step 11 verifies shares_outstanding_m against the latest results.

dashboard:
  name: Holdco Intel
  base_currency: USD
  fx_pairs:                 # yfinance symbols; all quoted vs USD
    - EURUSD=X
    - GBPUSD=X
    - JPY=X                 # USD/JPY
  user_agent: "holdco-intel/0.1 (+https://github.com/carsonstubstad/holdco-intel)"   # sent by core.util.fetch()
  site_url: https://carsonstubstad.github.io/holdco-intel/   # GitHub Pages; linked from Issues
  benchmark:                # chart reference line; not a company (step 12b)
    symbol: "^GSPC"
    name: S&P 500
    currency: USD

# Global title patterns applied to every company. Per-company patterns below add to these.
# A company's results_title_patterns are checked first; then category is the first match in
# this order (re.search, case-insensitive); flagged = category in flagged_categories.
classification:
  flagged_categories: [results, guidance, m_and_a, capital_markets]
  categories:
    results:         ["results", "revenue", "trading update", "quarter\\b", "half[- ]year", "full[- ]year", "annual report", "Q[1-4]\\b", "H[12]\\b", "FY ?20\\d\\d"]
    guidance:        ["guidance", "outlook", "upgrade", "downgrade", "raises", "lowers", "reiterates"]
    m_and_a:         ["acqui", "to acquire", "merger", "combination", "divest", "disposal", "sale of", "stake in", "completes", "joint venture"]
    capital_markets: ["capital markets day", "investor day", "investor presentation", "strategy update"]
    client:          ["appointed by", "agency of record", "\\baor\\b", "wins .*(account|business|pitch|mandate)", "selected by"]
    leadership:      ["appoint", "names .* as", "chief executive", "chief financial officer", "chief [a-z]+ officer", "\\bceo\\b", "\\bcfo\\b", "\\bchair", "to the board", "joins .* board", "board of directors.*appoint", "steps down", "to leave", "succession", "leadership transition", "directorate change"]
  default_category: other

companies:
  - code: PUB
    name: Publicis Groupe
    ticker: PUB.PA
    exchange: Euronext Paris
    currency: EUR
    color: "#1f77b4"
    shares_outstanding_m: 251.7        # diluted avg H1 2026 (results 2026-07-16)
    shares_verified: true
    news_query: '"Publicis Groupe"'
    press_releases:
      adapter: publicis
      url: https://www.publicisgroupe.com/en/news/press-releases   # static HTML archive list (step 08)
    calendar:
      parser: publicis
      url: https://www.publicisgroupe.com/en/investors/investors-analysts/events   # static HTML (step 08c)
    results_title_patterns: ["revenue", "organic growth", "results"]
    fiscal_year_end: "12-31"

  - code: OMC
    name: Omnicom Group (incl. IPG)
    ticker: OMC
    exchange: NYSE
    currency: USD
    color: "#ff7f0e"
    shares_outstanding_m: 281.0        # diluted avg Q2 2026 (results 2026-07-28)
    shares_verified: true
    news_query: '"Omnicom"'
    press_releases:
      adapter: omnicom
      # Q4 IR JSON feed the IR news page loads; categoryId from its q4News module (step 08)
      url: "https://investor.omc.com/feed/PressRelease.svc/GetPressReleaseList?LanguageId=1&bodyType=0&pressReleaseDateFilter=3&categoryId=1cb807d2-208f-4bc3-9133-6a9ad45ac3b0&pageSize=20&pageNumber=0&tagList=&includeTags=true&year=-1&excludeSelection=1"
    calendar:
      parser: omnicom
      # Q4 IR JSON the events page's q4Events widget loads; all dates, newest first (step 08c)
      url: "https://investor.omc.com/feed/Event.svc/GetEventList?LanguageId=1&eventSelection=3&eventDateFilter=3&includeTags=true&year=-1&tagList=&excludeSelection=1&pageSize=20&pageNumber=0&sortOperator=1&includeFinancialReports=false&includePresentations=false&includePressReleases=false"
      crawl_delay_s: 10                # robots.txt Crawl-delay; same host as press releases
    results_title_patterns: ["results", "quarter\\b"]
    fiscal_year_end: "12-31"
    notes: "Organic growth not comparable across the IPG close; label pre/post."

  - code: WPP
    name: WPP plc
    ticker: WPP.L
    exchange: London Stock Exchange
    currency: GBP
    price_currency: GBX              # optional; unit of yfinance closes when it differs (pence)
    color: "#2ca02c"
    shares_outstanding_m: 1078.8       # in issue less treasury, 30 Jun 2026 (interim results)
    shares_verified: true
    news_query: '"WPP"'
    press_releases:
      adapter: wpp
      url: https://www.wpp.com/en/news   # static HTML list (step 05)
    calendar:
      parser: wpp
      url: https://www.wpp.com/en/investors/calendar-and-events   # static HTML (step 08c)
    results_title_patterns: ["trading update", "results", "like-for-like"]
    fiscal_year_end: "12-31"
    notes: "WPP.L quotes in pence (GBX). Divide by 100 before FX conversion."

  - code: HAVAS
    name: Havas N.V.
    ticker: HAVAS.AS
    exchange: Euronext Amsterdam
    currency: EUR
    color: "#d62728"
    shares_outstanding_m: 97.6         # net shares, 30 Jun 2026 (H1 results)
    shares_verified: true
    news_query: '"Havas"'
    press_releases:
      adapter: havas
      url: https://www.havas.com/feed/?post_type=press_release   # WP press_release RSS (step 08)
    calendar:
      parser: havas
      url: https://www.havas.com/investor-relations-shareholders/financial-and-ir-calendar-contact/
      crawl_delay_s: 10                # robots.txt Crawl-delay; same host as press releases
    results_title_patterns: ["revenue", "results", "net revenue"]
    fiscal_year_end: "12-31"
    notes: "Listed December 2024; price history starts then."

  - code: DENTSU
    name: Dentsu Group Inc.
    ticker: 4324.T
    exchange: Tokyo Stock Exchange
    currency: JPY
    color: "#9467bd"
    shares_outstanding_m: 262.0        # verify
    shares_verified: false
    news_query: '"Dentsu"'
    press_releases:
      adapter: dentsu
      url: https://www.group.dentsu.com/en/news/release/index.xml   # news release RSS (step 08)
    # no calendar block: the IR calendar renders only via the robots-disallowed E-IR widget (FAILURES.md)
    results_title_patterns: ["consolidated financial results", "results", "quarter\\b"]
    fiscal_year_end: "12-31"

  - code: STGW
    name: Stagwell Inc.
    ticker: STGW
    exchange: NASDAQ
    currency: USD
    color: "#8c564b"
    shares_outstanding_m: 262.0        # verify; Class A + Class C
    shares_verified: false
    news_query: '"Stagwell"'
    press_releases:
      adapter: stagwell
      url: https://www.stagwellglobal.com/category/press/feed/   # WP press category RSS (step 08)
    calendar:
      parser: stagwell
      url: https://www.stagwellglobal.com/investors/events-and-presentations/   # static HTML (step 08c)
    results_title_patterns: ["results", "quarter\\b", "net revenue"]
    fiscal_year_end: "12-31"
