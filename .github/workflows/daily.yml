name: daily

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    concurrency:
      group: daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # a re-run of an old run must still build on the latest main

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev

      - name: Run pipeline
        run: uv run --no-sync python -m pipeline.run

      - name: Validate
        run: uv run --no-sync python -m pipeline.validate

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Curate nudge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/nudge.md"
          uv run --no-sync python -m pipeline.nudge > "$body"
          if [ ! -s "$body" ]; then
            echo "nothing to curate"
            exit 0
          fi
          issue=$(gh issue list --label curate --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file "$body"
          else
            gh issue create --title "Curate needed" --label curate --body-file "$body"
          fi

      - name: Calendar nudge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/calendar.md"
          uv run --no-sync python -m pipeline.nudge calendar > "$body"
          file=docs/data/event_candidates.json
          issue=$(gh issue list --label calendar --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ ! -s "$body" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "No calendar dates pending review."
            fi
            echo "no calendar candidates"
          elif [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file "$body"
          elif [ "$(jq '.new_ids | length' "$file")" != "0" ]; then
            gh issue create --title "Calendar review needed" --label calendar --body-file "$body"
          else
            echo "no new calendar candidates"
          fi
