name: daily

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    concurrency:
      group: daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev

      - name: Run pipeline
        run: uv run --no-sync python -m pipeline.run

      - name: Validate
        run: uv run --no-sync python -m pipeline.validate

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Curate nudge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/nudge.md"
          uv run --no-sync python -m pipeline.nudge > "$body"
          if [ ! -s "$body" ]; then
            echo "nothing to curate"
            exit 0
          fi
          issue=$(gh issue list --label curate --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file "$body"
          else
            gh issue create --title "Curate needed" --label curate --body-file "$body"
          fi
